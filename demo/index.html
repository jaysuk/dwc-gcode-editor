<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>dwc-gcode-editor demo</title>
<style>
	:root { color-scheme: light dark; }
	html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; font-size: 14px; }
	body { display: flex; flex-direction: column; }

	#toolbar {
		display: flex; align-items: center; gap: 8px; padding: 6px 10px;
		border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
		flex-wrap: wrap;
	}
	#toolbar button { cursor: pointer; }
	#toolbar .spacer { flex: 1; }
	#stats { opacity: 0.7; font-size: 12px; }

	#panes { display: flex; flex: 1; min-height: 0; }
	.pane { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; }
	.pane + .pane { border-left: 1px solid color-mix(in srgb, currentColor 20%, transparent); }

	.tabstrip { display: flex; gap: 2px; padding: 4px 4px 0; overflow-x: auto; }
	.tab {
		padding: 4px 10px; border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
		border-bottom: none; border-radius: 4px 4px 0 0; cursor: pointer; white-space: nowrap;
		background: color-mix(in srgb, currentColor 5%, transparent);
	}
	.tab.active { background: color-mix(in srgb, currentColor 12%, transparent); font-weight: 600; }
	.tab.dirty::after { content: " *"; color: #d18b00; }
	.tab .close { margin-left: 6px; opacity: 0.6; }
	.tab .close:hover { opacity: 1; }

	.editor-slot { flex: 1; min-height: 0; position: relative; }
	.editor-slot > div { position: absolute; inset: 0; overflow: hidden; }
	.editor-slot > div[hidden] { display: none !important; }
	.cm-editor { height: 100%; font-size: 13px; }
	.cm-scroller { overflow: auto; font-family: ui-monospace, monospace; }

	#log { padding: 4px 10px; font-size: 12px; max-height: 6em; overflow-y: auto; opacity: 0.85; }
</style>
</head>
<body>
	<div id="toolbar">
		<button id="btn-open">Open file…</button>
		<button id="btn-new-tab">New empty tab</button>
		<button id="btn-split">Split right</button>
		<button id="btn-close-split">Close split</button>
		<button id="btn-check">Check for errors</button>
		<label>Firmware: <input id="fw-version" value="3.7.0" size="8" /></label>
		<label><input type="checkbox" id="chk-dark" /> Dark mode</label>
		<span style="opacity:0.6">(Ctrl+Space for parameters)</span>
		<div class="spacer"></div>
		<span id="stats"></span>
	</div>
	<div id="panes"></div>
	<div id="log"></div>
	<input type="file" id="file-input" accept=".g,.gcode,.gc,.txt" style="display:none" />
	<script type="module" src="/main.ts"></script>
</body>
</html>
